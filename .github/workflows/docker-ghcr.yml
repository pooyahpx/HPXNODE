name: Build and push node image (GHCR)

# Builds the multi-backend node image and pushes it to this fork's GitHub
# Container Registry so `docker compose up` can pull it — no Docker Hub secrets
# needed, only the built-in GITHUB_TOKEN.
#
# Deliberately plain: the image name/tags are computed with shell instead of
# docker/metadata-action (which was failing here and skipping the build, so a
# fixed image never shipped), and we build linux/amd64 only — every node runs
# on x86 and the emulated arm64 leg tripled build time for nothing.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tags
        id: img
        run: |
          set -eux
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          tags="${image}:latest,${image}:${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${image}:${GITHUB_REF_NAME}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}"   >> "$GITHUB_OUTPUT"

      # The host-firewall rules decide whether tunnel traffic reaches the internet
      # at all, and a mistake there is invisible until a user reports "connects but
      # nothing works" — so they get tested before anything ships.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test host routing + ikev2 revocation
        run: go test ./backend/hostroute/... ./backend/ikev2/... -v

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Pushed ${{ steps.img.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
